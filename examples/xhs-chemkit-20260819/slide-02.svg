<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><style>
text { font-family: 'PingFang SC','Helvetica Neue',Arial,sans-serif; letter-spacing: 0; }
.title { letter-spacing: -1.5px; }
.eyebrow { letter-spacing: 2px; }
.subtitle { letter-spacing: 0.2px; }
.body { letter-spacing: 0.1px; }
.footer { letter-spacing: 1px; }
</style><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F7F3EA" stroke="none" stroke-width="0"/><text class="eyebrow" x="100" y="62" font-size="20px" fill="#E76F51" font-weight="800" text-anchor="start">CHEMKIT  /  02</text><text class="title" x="100" y="132" font-size="62px" fill="#102A43" font-weight="800" text-anchor="start">问题不在结构</text><text class="eyebrow" x="100" y="180" font-size="22px" fill="#2A9D8F" font-weight="700" text-anchor="start">为什么以前总觉得“不像”</text><text class="subtitle" x="100" y="225" font-size="26px" fill="#627D98" font-weight="500" text-anchor="start">而在结构和文字没有使用同一套视觉尺度</text><rect x="100" y="300" width="820" height="640" rx="30" fill="#FFFFFF" stroke="none" stroke-width="0"/><rect x="1000" y="300" width="820" height="640" rx="30" fill="#102A43" stroke="none" stroke-width="0"/><text class="body" x="150" y="370" font-size="28px" fill="#E76F51" font-weight="800" text-anchor="start">以前</text><text class="body" x="1050" y="370" font-size="28px" fill="#F4A261" font-weight="800" text-anchor="start">新版 ChemKit</text><text class="body" x="150" y="455" font-size="27px" fill="#1F2933" font-weight="600" text-anchor="start">苯环大小对了</text>
<text class="body" x="150" y="517" font-size="27px" fill="#1F2933" font-weight="600" text-anchor="start">但原子标签偏小</text>
<text class="body" x="150" y="579" font-size="27px" fill="#1F2933" font-weight="600" text-anchor="start">条件文字漂得太高</text>
<text class="body" x="150" y="641" font-size="27px" fill="#1F2933" font-weight="600" text-anchor="start">编号贴着结构</text>
<text class="body" x="150" y="703" font-size="27px" fill="#1F2933" font-weight="600" text-anchor="start">加号不在两个分子中间</text><text class="body" x="1050" y="455" font-size="27px" fill="#FFFFFF" font-weight="600" text-anchor="start">以有效键长为基准</text>
<text class="body" x="1050" y="517" font-size="27px" fill="#FFFFFF" font-weight="600" text-anchor="start">原子 / 条件 / 编号统一比例</text>
<text class="body" x="1050" y="579" font-size="27px" fill="#FFFFFF" font-weight="600" text-anchor="start">按可见边界放置加号和箭头</text>
<text class="body" x="1050" y="641" font-size="27px" fill="#FFFFFF" font-weight="600" text-anchor="start">共享编号基线</text>
<text class="body" x="1050" y="703" font-size="27px" fill="#FFFFFF" font-weight="600" text-anchor="start">保留片段朝向</text><rect x="150" y="805" width="720" height="92" rx="22" fill="#FDE9E2" stroke="none" stroke-width="0"/><rect x="1050" y="805" width="720" height="92" rx="22" fill="#1E405F" stroke="none" stroke-width="0"/><text class="body" x="510" y="862" font-size="25px" fill="#E76F51" font-weight="800" text-anchor="middle">“能画” ≠ “像论文”</text><text class="body" x="1410" y="862" font-size="25px" fill="#F4A261" font-weight="800" text-anchor="middle">视觉规则可复用</text><text class="footer" x="100" y="1045" font-size="18px" fill="#627D98" font-weight="600" text-anchor="start">RDKit  ·  SVG  ·  ChemDraw-like layout</text><text class="footer" x="1820" y="1045" font-size="18px" fill="#627D98" font-weight="700" text-anchor="end">2/5</text></svg>